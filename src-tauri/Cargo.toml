[package]
name = "beads-station"
version = "0.1.6"
description = "Beads Station — Phase 1 Tauri shell"
authors = ["beads-station"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "beads_station_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: editing the user's Claude settings must keep their key order.
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.8"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "io-util", "sync", "net"] }
bytes = "1"
once_cell = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# RV3-B (Code-8ro): gitignore-aware directory listing for the file-nav pane.
# Same engine as ripgrep — respects .gitignore/.ignore, supports bounded depth.
ignore = "0.4"
# Phase 7 (Code-ky4.7): local date/time for the Obsidian daily writer. clock =
# local-timezone Local::now (the daily filename + HH:MM stamp must be wall-clock
# local, not UTC); default-features off drops the unused oldtime/serde weight.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Code-9d8: minimal blocking HTTPS client for the optional gateway spend API
# (BS_GATEWAY_SPEND_URL). rustls avoids an OpenSSL system dep; native-certs
# uses the macOS trust store so corporate-internal cert chains validate.
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "json"] }
tauri-plugin-notification = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
