[package]
name = "beads-station"
version = "0.1.0"
description = "Beads Station — Phase 1 Tauri shell"
authors = ["beads-station"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "beads_station_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "io-util", "sync"] }
bytes = "1"
once_cell = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
